name: Bug report
description: Report a reproducible defect
title: "[BUG] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "Report only behavior you can reproduce. Remove secrets and private data."
  - type: input
    id: version
    attributes:
      label: Version / commit
      description: Release, commit SHA, or build identifier.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, architecture, compiler/runtime, hardware or deployment target.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      placeholder: "1. ...\n2. ..."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior and evidence
      description: Include logs, test output, screenshots, or traces with secrets redacted.
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: Impact / workaround
