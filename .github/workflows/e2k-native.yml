name: NUNLauncher E2K native qualification

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2k-native:
    runs-on: [self-hosted, linux, e2k]
    steps:
      - uses: actions/checkout@v4
      - name: Verify E2K host and LCC
        run: |
          test "$(uname -m)" = "e2k"
          command -v lcc
          lcc --version
      - name: Build and test with native LCC
        run: |
          cmake -S . -B .build-e2k -DCMAKE_C_COMPILER=lcc -DBUILD_TESTING=ON
          cmake --build .build-e2k --parallel
          ctest --test-dir .build-e2k --output-on-failure
