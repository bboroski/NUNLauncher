name: Jun-Jun Repository Guard

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jun-jun-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guard:
    name: Read-only source hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Inspect tracked source safely
        shell: bash
        run: |
          python3 - <<'PY'
          import pathlib, re, subprocess, sys
          raw = subprocess.check_output(["git", "ls-files", "-z"]).split(b"\0")
          extensions = {".py",".c",".h",".cc",".cpp",".hpp",".rs",".go",".js",".jsx",".ts",".tsx",".java",".cs",".sh",".ps1",".yml",".yaml",".toml",".json",".xml",".html"}
          patterns = [
              re.compile(r"-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----"),
              re.compile(r"\bgh[pousr]_[A-Za-z0-9]{30,}\b"),
              re.compile(r"\bgithub_pat_[A-Za-z0-9_]{30,}\b"),
              re.compile(r"\bAKIA[0-9A-Z]{16}\b"),
          ]
          issues, inspected = [], 0
          for item in raw:
              if not item: continue
              name = item.decode("utf-8", "replace")
              path = pathlib.PurePosixPath(name)
              if ".git" in path.parts or path.suffix.lower() not in extensions: continue
              try: data = pathlib.Path(name).read_bytes()
              except OSError:
                  issues.append((name, "unreadable tracked file")); continue
              if len(data) > 2_000_000 or b"\0" in data[:8192]: continue
              inspected += 1
              for number, line in enumerate(data.decode("utf-8", "replace").splitlines(), 1):
                  if re.match(r"^<<<<<<< ", line) or re.match(r"^>>>>>>> ", line):
                      issues.append((name, f"possible merge-conflict marker at line {number}"))
                  if any(p.search(line) for p in patterns):
                      issues.append((name, f"possible credential marker at line {number}"))
          if issues:
              for name, reason in issues: print(f"Jun-Jun: {name}: {reason}")
              print(f"Jun-Jun failed; inspected {inspected} files."); sys.exit(1)
          print(f"Jun-Jun passed; inspected {inspected} tracked source files.")
          print("Hygiene only: no build, tests, runtime or hardware qualification implied.")
          PY
