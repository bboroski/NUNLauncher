name: Feature request
description: Propose a scoped, testable improvement
title: "[FEATURE] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem and user impact
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe observable behavior, not only implementation preference.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: List measurable outcomes and failure cases.
    validations:
      required: true
  - type: textarea
    id: compatibility
    attributes:
      label: Compatibility and dependencies
      description: Note API/ABI, platform, security, migration, and cross-repository impact.
  - type: textarea
    id: validation
    attributes:
      label: Validation approach
      description: Tests, coverage, docs, and platform matrix needed.
