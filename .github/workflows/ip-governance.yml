name: IP governance
on:
  push:
    paths: ["ip-governance/**", ".github/workflows/ip-governance.yml"]
  pull_request:
    paths: ["ip-governance/**", ".github/workflows/ip-governance.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: python ip-governance/verify.py
