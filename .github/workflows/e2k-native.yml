name: NUNLauncher E2K native admission

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2k-native:
    runs-on: [self-hosted, linux, e2k]
    steps:
      - uses: actions/checkout@v4
      - name: Verify E2K Linux runner
        run: |
          test "$(uname -m)" = "e2k"
          python3 --version
          command -v lcc
      - name: Test NUNLauncher verifier on E2K
        run: make test
      - name: Check out NUN E2K runtime source
        uses: actions/checkout@v4
        with:
          repository: bboroski/NUN
          ref: feat/boot-media-installer
          path: .deps/NUN
      - name: Build E2K runtime with vendor LCC
        run: make -C .deps/NUN e2k-host
      - name: Verify E2K ELF and manifest
        run: |
          PYTHONPATH=. python3 -m nunlauncher_boot.cli verify-e2k \
            --binary .deps/NUN/build/e2k/NUN-E2K-host \
            --manifest .deps/NUN/build/e2k/NUN-E2K-host.json \
            --json | tee .deps/NUN/build/e2k/NUNLauncher-e2k-verification.json
      - name: Execute native E2K runtime
        run: make -C .deps/NUN e2k-host-test
      - name: Upload E2K runtime and verification
        uses: actions/upload-artifact@v4
        with:
          name: NUNLauncher-E2K-native-runtime
          path: |
            .deps/NUN/build/e2k/NUN-E2K-host
            .deps/NUN/build/e2k/NUN-E2K-host.json
            .deps/NUN/build/e2k/NUNLauncher-e2k-verification.json
